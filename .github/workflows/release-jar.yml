# Compila o sistema e anexa o .jar executável à Release do GitHub.
# - Roda sozinho ao publicar uma nova Release.
# - Também pode ser disparado manualmente em Actions > "Release JAR" > Run workflow.
name: Release JAR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da Release que vai receber o .jar
        required: true
        default: v2.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código da tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar o .jar
        run: |
          chmod +x mvnw
          ./mvnw -B -q clean package -DskipTests

      - name: Anexar arquivos à Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            target/sistema-erp-hibernate.jar
            config.local.properties.example
