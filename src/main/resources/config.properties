# Copie para config.local.properties (não versionado) ou use variáveis de ambiente.
# Template de transaction pooler Supabase. Substitua PROJECT-REF e REGION.
db.url=jdbc:postgresql://aws-0-REGION.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
db.user=postgres.PROJECT-REF
db.password=SUBSTITUA_PELA_SENHA
db.driver=org.postgresql.Driver
db.dialect=org.hibernate.dialect.PostgreSQLDialect
# validate garante que o Hibernate não cria nem apaga tabelas.
db.ddl=validate
db.show_sql=false
